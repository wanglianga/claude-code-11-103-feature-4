server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: medwaste-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/ccdev}
    username: ${SPRING_DATASOURCE_USERNAME:ccdev}
    password: ${SPRING_DATASOURCE_PASSWORD:ccdev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  # 虚构约定：称重差绝对值超过该阈值（千克）即转差异核实
  weight-tolerance-kg: 0.5

logging:
  level:
    com.medwaste: INFO
